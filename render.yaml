services:
  - type: web
    name: samodus-hotels
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: SITE_URL
        value: https://samodus-hotels.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: redirect
        source: /booking
        destination: /book
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /terms
        destination: /privacy
      - type: redirect
        source: /rooms/index.html
        destination: /rooms
